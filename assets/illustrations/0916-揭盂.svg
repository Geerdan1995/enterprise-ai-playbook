<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="KaiTi, STKaiti, 楷体, serif">
  <!-- 纯白底 -->
  <rect x="0" y="0" width="680" height="400" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1"/>

  <!-- 左：1986 油印词卡一摞 -->
  <g>
    <rect x="66" y="128" width="118" height="76" rx="2" fill="#FFFDF5" stroke="#A8A29E" stroke-width="1.5" transform="rotate(-3 125 166)"/>
    <rect x="76" y="146" width="118" height="76" rx="2" fill="#FFFDF5" stroke="#A8A29E" stroke-width="1.5" transform="rotate(2 135 184)"/>
    <rect x="70" y="164" width="118" height="76" rx="2" fill="#FFFDF5" stroke="#57534E" stroke-width="1.8"/>
    <text x="82" y="192" font-size="19" font-weight="700" fill="#292524">减速器</text>
    <text x="82" y="212" font-size="13" fill="#57534E">代：减速机 · 减速箱</text>
    <text x="82" y="228" font-size="10" fill="#A8A29E">注：指整机，不指零件</text>
  </g>
  <text x="62" y="104" font-size="17" fill="#2563EB">1986 · 总目</text>

  <!-- 中：同一个东西（齿轮）从左走到右 -->
  <path d="M200,208 C250,190 290,232 330,210" fill="none" stroke="#A8A29E" stroke-width="1.8" stroke-dasharray="6 6"/>
  <g transform="translate(330,208)">
    <circle r="34" fill="none" stroke="#1C1917" stroke-width="2.6"/>
    <circle r="9" fill="none" stroke="#1C1917" stroke-width="2.2"/>
    <!-- 齿：八条径向短线 -->
    <g stroke="#1C1917" stroke-width="4" stroke-linecap="round">
      <line x1="0" y1="-34" x2="0" y2="-42"/>
      <line x1="24" y1="-24" x2="30" y2="-30"/>
      <line x1="34" y1="0" x2="42" y2="0"/>
      <line x1="24" y1="24" x2="30" y2="30"/>
      <line x1="0" y1="34" x2="0" y2="42"/>
      <line x1="-24" y1="24" x2="-30" y2="30"/>
      <line x1="-34" y1="0" x2="-42" y2="0"/>
      <line x1="-24" y1="-24" x2="-30" y2="-30"/>
    </g>
  </g>
  <path d="M378,208 C400,196 418,196 436,200" fill="none" stroke="#A8A29E" stroke-width="1.8" stroke-dasharray="6 6"/>
  <text x="262" y="140" font-size="15" fill="#D97706">东西还是那个东西</text>

  <!-- 小黑：中间下方，正把一张词卡递向屏幕 -->
  <g>
    <ellipse cx="350" cy="312" rx="21" ry="27" fill="#1C1917"/>
    <circle cx="343" cy="304" r="2.3" fill="#FFFFFF"/>
    <circle cx="357" cy="304" r="2.3" fill="#FFFFFF"/>
    <path d="M343,339 L339,372" stroke="#1C1917" stroke-width="3" stroke-linecap="round"/>
    <path d="M357,339 L362,372" stroke="#1C1917" stroke-width="3" stroke-linecap="round"/>
    <path d="M330,317 L312,336" stroke="#1C1917" stroke-width="3" stroke-linecap="round"/>
    <path d="M369,306 L398,286" stroke="#1C1917" stroke-width="3" stroke-linecap="round"/>
    <!-- 手里的词卡 -->
    <rect x="398" y="262" width="44" height="28" rx="2" fill="#FFFDF5" stroke="#57534E" stroke-width="1.6" transform="rotate(-8 420 276)"/>
    <text x="408" y="281" font-size="13" fill="#292524">词卡</text>
  </g>

  <!-- 右：屏幕里的节点连线图（全书首次允许"连线"出现的位置） -->
  <g>
    <path d="M446,108 L626,105 L629,254 L449,257 Z" fill="#FFFFFF" stroke="#1C1917" stroke-width="2.4" stroke-linejoin="round"/>
    <line x1="500" y1="258" x2="500" y2="272" stroke="#1C1917" stroke-width="2.4"/>
    <line x1="570" y1="258" x2="570" y2="272" stroke="#1C1917" stroke-width="2.4"/>
    <line x1="478" y1="274" x2="594" y2="274" stroke="#1C1917" stroke-width="2.8" stroke-linecap="round"/>
    <!-- 节点与边 -->
    <g stroke="#78716C" stroke-width="1.6">
      <line x1="480" y1="150" x2="540" y2="130"/>
      <line x1="480" y1="150" x2="530" y2="200"/>
      <line x1="540" y1="130" x2="600" y2="170"/>
      <line x1="530" y1="200" x2="600" y2="170"/>
      <line x1="530" y1="200" x2="560" y2="232"/>
      <line x1="600" y1="170" x2="560" y2="232"/>
    </g>
    <g fill="#1C1917">
      <circle cx="480" cy="150" r="6"/>
      <circle cx="540" cy="130" r="6"/>
      <circle cx="530" cy="200" r="6"/>
      <circle cx="600" cy="170" r="6"/>
      <circle cx="560" cy="232" r="6"/>
    </g>
    <text x="472" y="176" font-size="11" fill="#78716C">批次</text>
    <text x="600" y="192" font-size="11" fill="#78716C">整机</text>
  </g>
  <text x="448" y="92" font-size="17" fill="#D97706">今天 · 本体</text>
  <text x="424" y="310" font-size="16" fill="#EF4444">连成图 · 知识图谱</text>

  <!-- 底部一句 -->
  <text x="340" y="382" font-size="16" fill="#2563EB" text-anchor="middle">名目换了。</text>
</svg>
