<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>书版样张 · 三层总图（dynamic-ui 管线）</title>
<style>
  body { background:#FFFFFF; margin:0; padding:40px 0; font-family:"Noto Sans SC","Microsoft YaHei",sans-serif; }
  /* 模拟书页版心：A4 794px - 左右 padding 110px = 684px */
  .page { width:684px; margin:0 auto; }
  .figure { margin:20px 0; }
  .figure img { width:100%; height:auto; display:block; border:1px solid #E7E5E4; border-radius:12px; }
  .figcap { font-size:12px; color:#92400E; font-weight:700; letter-spacing:1px; margin-top:8px; }
  p.body { font-size:14.5px; line-height:1.9; color:#292524; margin:0 0 16px; }
</style>
</head>
<body>
<div class="page">
  <p class="body">按这段话画下来，是上下三层：最上层是本体，定规矩；中间层是图谱，装事实；最下层是应用，出答案。三层各自的内容如下。</p>
  <div class="figure">
    <img src="book-三层总图.png" alt="三层总图">
    <div class="figcap">图 1 ｜ 总目在上，卡在中间，应用在下（第16章）</div>
  </div>
</div>
</body>
</html>
