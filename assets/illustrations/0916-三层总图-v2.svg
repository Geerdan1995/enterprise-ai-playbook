<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#52525B"/>
    </marker>
  </defs>

  <!-- ===== 顶层：本体 ===== -->
  <rect x="40" y="40" width="640" height="88" rx="12" fill="#F7F7F8" stroke="rgba(23,23,23,0.12)" stroke-width="1"/>
  <text x="64" y="76" font-size="16" font-weight="600" fill="#171717">本体<tspan fill="#52525B" font-weight="400" font-size="14">　小说里叫：总目</tspan></text>
  <text x="64" y="104" font-size="14" fill="#52525B">定规矩　·　词　代　注　属分　凭据</text>

  <!-- 线1 + 标签胶囊 -->
  <path d="M 360 128 V 164" fill="none" stroke="#52525B" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="384" y="132" width="204" height="26" rx="999" fill="#F7F7F8" stroke="rgba(23,23,23,0.12)" stroke-width="1"/>
  <text x="398" y="150" font-size="12" fill="#92400E">记的时候，用总目的词</text>

  <!-- ===== 中层：知识图谱 ===== -->
  <rect x="40" y="168" width="640" height="88" rx="12" fill="#F7F7F8" stroke="rgba(23,23,23,0.12)" stroke-width="1"/>
  <text x="64" y="204" font-size="16" font-weight="600" fill="#171717">知识图谱<tspan fill="#52525B" font-weight="400" font-size="14">　小说里叫：连成图的卡和账</tspan></text>
  <text x="64" y="232" font-size="14" fill="#52525B">装事实　·　节点　边　条目　原声</text>

  <!-- 线2 + 标签胶囊 -->
  <path d="M 360 256 V 292" fill="none" stroke="#52525B" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="384" y="260" width="204" height="26" rx="999" fill="#F7F7F8" stroke="rgba(23,23,23,0.12)" stroke-width="1"/>
  <text x="398" y="278" font-size="12" fill="#92400E">能重演，才有下一层</text>

  <!-- ===== 底层：应用 ===== -->
  <rect x="40" y="296" width="640" height="88" rx="12" fill="#F7F7F8" stroke="rgba(23,23,23,0.12)" stroke-width="1"/>
  <text x="64" y="332" font-size="16" font-weight="600" fill="#171717">应用</text>
  <g font-size="14" fill="#52525B">
    <text x="64" y="360">问答</text>
    <text x="222" y="360">追溯</text>
    <text x="380" y="360">看板</text>
    <text x="538" y="360">审核</text>
  </g>
  <g font-size="12" fill="#A1A1AA">
    <text x="106" y="360">带出处</text>
    <text x="264" y="360">链上走通</text>
    <text x="422" y="360">红黄牌</text>
    <text x="580" y="360">答得出缺</text>
  </g>
</svg>
