<style>
:root { --text:#292524; --text-muted:#57534E; --border:rgba(41,37,36,0.14); --brand:#92400E; --brand-soft:#FBF3E4; --radius:8px; --radius-card:12px; --radius-full:999px; --s16:16px; --font:"Microsoft YaHei","PingFang SC",sans-serif; }
.widget { color:var(--text); font:400 14px/20px var(--font); width:100%; }
.card { box-sizing:border-box; width:100%; background:#fff; border:1px solid var(--border); border-radius:var(--radius-card); padding:var(--s16); }
</style>
<div class="widget" data-dynamic-ui-widget data-template="gantt-chart">
  <section class="card">
    <svg viewBox="0 0 680 190" style="width:684px;height:190px;display:block" role="img" aria-label="五幕一年时间轴">
      <!-- 主轴 -->
      <line x1="50" y1="110" x2="640" y2="110" stroke="#A8A29E" stroke-width="2"/>
      <!-- 五幕分段 -->
      <g font-family="Microsoft YaHei" font-size="11.5" text-anchor="middle">
        <rect x="50"  y="94" width="98"  height="32" rx="16" fill="#FAF7F2" stroke="#A8A29E" stroke-width="1.2"/>
        <text x="99"  y="114" fill="#292524">完美风暴</text>
        <rect x="168" y="94" width="98"  height="32" rx="16" fill="#FAF7F2" stroke="#A8A29E" stroke-width="1.2"/>
        <text x="217" y="114" fill="#292524">点火与速胜</text>
        <rect x="286" y="94" width="86"  height="32" rx="16" fill="#FAF7F2" stroke="#A8A29E" stroke-width="1.2"/>
        <text x="329" y="114" fill="#292524">星火</text>
        <rect x="392" y="94" width="86"  height="32" rx="16" fill="#FAF7F2" stroke="#A8A29E" stroke-width="1.2"/>
        <text x="435" y="114" fill="#292524">大考</text>
        <rect x="498" y="94" width="142" height="32" rx="16" fill="#FBF3E4" stroke="#92400E" stroke-width="1.5"/>
        <text x="569" y="114" fill="#92400E" font-weight="600">终局与传承</text>
      </g>
      <!-- 关键日节点（上） -->
      <g font-family="Microsoft YaHei" font-size="10.5" fill="#57534E" text-anchor="middle">
        <g><circle cx="50" cy="110" r="5" fill="#292524"/><text x="50" y="88" fill="#292524" font-weight="600">3/17 开工</text><text x="50" y="74">四个坏消息</text></g>
        <g><circle cx="217" cy="110" r="5" fill="#78716C"/><text x="217" y="146" font-weight="500">6/30 验收</text></g>
        <g><circle cx="418" cy="110" r="5" fill="#78716C"/><text x="418" y="146" font-weight="500">2/26 董事会</text></g>
        <g><circle cx="500" cy="110" r="5" fill="#78716C"/><text x="500" y="88" font-weight="500">5/10 审核</text></g>
        <g><circle cx="628" cy="110" r="6" fill="#92400E"/><text x="628" y="88" fill="#92400E" font-weight="600">5/31 退休</text></g>
      </g>
      <!-- 起止年份 -->
      <text x="50" y="168" font-size="11" fill="#57534E" font-family="Microsoft YaHei">2026.3.17</text>
      <text x="640" y="168" font-size="11" fill="#57534E" text-anchor="end" font-family="Microsoft YaHei">2027.5.31</text>
    </svg>
  </section>
</div>
