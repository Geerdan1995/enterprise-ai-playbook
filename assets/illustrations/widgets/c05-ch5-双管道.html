<style>
:root { --text:#292524; --text-muted:#57534E; --border:rgba(41,37,36,0.14); --brand:#92400E; --brand-soft:#FBF3E4; --radius:8px; --radius-card:12px; --s8:8px; --s16:16px; --s20:20px; --font:"Microsoft YaHei","PingFang SC",sans-serif; }
.widget { color:var(--text); font:400 14px/20px var(--font); width:100%; }
.card { box-sizing:border-box; width:100%; background:#fff; border:1px solid var(--border); border-radius:var(--radius-card); padding:var(--s20); }
</style>
<div class="widget" data-dynamic-ui-widget data-template="explanation-panel">
  <section class="card">
    <svg viewBox="8 28 646 292" style="width:100%;height:auto;display:block" role="img" aria-label="同一道题，两条管">
      <defs>
        <marker id="p1" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">
          <path d="M1 1 L7 4 L1 7 Z" fill="#57534E"/>
        </marker>
        <marker id="p2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">
          <path d="M1 1 L7 4 L1 7 Z" fill="#92400E"/>
        </marker>
      </defs>

      <!-- 左端：同一道题 -->
      <rect x="20" y="128" width="66" height="66" rx="8" fill="#F3EEE5" stroke="#78716C" stroke-width="1.5"/>
      <text x="53" y="156" font-size="12" fill="#292524" text-anchor="middle" font-family="Noto Sans SC">同一</text>
      <text x="53" y="174" font-size="12" fill="#292524" text-anchor="middle" font-family="Noto Sans SC">道题</text>

      <!-- ===== 上管：SQL 粗管 ===== -->
      <text x="176" y="52" font-size="12" fill="#57534E" font-family="Noto Sans SC">上管 · 116 行，五层嵌套</text>
      <!-- 粗管：双线+内部股线 -->
      <rect x="100" y="60" width="300" height="34" rx="6" fill="#EFEAE3" stroke="#A8A29E" stroke-width="1.4"/>
      <path d="M108 71 H392 M108 77 H392 M108 83 H392" stroke="#C9C2B8" stroke-width="0.8" fill="none"/>
      <!-- 管中打结：改到 v3 -->
      <g stroke="#C0392B" stroke-width="1.8" fill="none" stroke-linecap="round">
        <path d="M240 60 C 250 70, 230 84, 244 94"/>
        <path d="M258 60 C 248 70, 268 84, 254 94"/>
      </g>
      <text x="250" y="112" font-size="10.5" fill="#C0392B" text-anchor="middle" font-family="Noto Sans SC">改到 v3 · 夜里两点</text>
      <!-- 上管输出：4 出口，3 通 1 红 -->
      <path d="M400 77 H432" fill="none" stroke="#78716C" stroke-width="1.4" marker-end="url(#p1)"/>
      <g>
        <rect x="440" y="42" width="26" height="18" rx="3" fill="#DDD6CE" stroke="#A8A29E" stroke-width="0.8"/>
        <rect x="440" y="66" width="26" height="18" rx="3" fill="#DDD6CE" stroke="#A8A29E" stroke-width="0.8"/>
        <rect x="440" y="90" width="26" height="18" rx="3" fill="#DDD6CE" stroke="#A8A29E" stroke-width="0.8"/>
        <rect x="440" y="114" width="26" height="18" rx="3" fill="#FDE8E4" stroke="#C0392B" stroke-width="1.4" stroke-dasharray="3 2"/>
        <text x="453" y="127" font-size="9" fill="#C0392B" text-anchor="middle" font-weight="600" font-family="Noto Sans SC">漏</text>
        <text x="480" y="127" font-size="10.5" fill="#C0392B" font-family="Noto Sans SC">代理的 3 台不在里头</text>
      </g>
      <text x="560" y="77" font-size="11" fill="#57534E" font-family="Consolas">2:17</text>

      <!-- 下管：图 细管 -->
      <text x="176" y="212" font-size="12" fill="#92400E" font-family="Noto Sans SC">下管 · 1 行</text>
      <rect x="100" y="220" width="300" height="12" rx="6" fill="#FBF3E4" stroke="#92400E" stroke-width="1.5"/>
      <path d="M400 226 H432" fill="none" stroke="#92400E" stroke-width="1.6" marker-end="url(#p2)"/>
      <!-- 输出：全通 -->
      <g stroke="#92400E" stroke-width="1.2" fill="#FBF3E4">
        <rect x="440" y="206" width="26" height="18" rx="3"/>
        <rect x="440" y="230" width="26" height="18" rx="3"/>
        <rect x="440" y="254" width="26" height="18" rx="3"/>
      </g>
      <text x="560" y="231" font-size="11" fill="#92400E" font-family="Consolas">&lt;1s</text>
      <text x="480" y="278" font-size="10.5" fill="#92400E" font-family="Noto Sans SC">矿上那 3 台也在 · 挂错一台，40 秒改完</text>

      <!-- 中缝对比 -->
      <text x="53" y="306" font-size="10.5" fill="#57534E" font-family="Noto Sans SC">写：一天半 vs 五分钟</text>
    </svg>
  </section>
</div>
