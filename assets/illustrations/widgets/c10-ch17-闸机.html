<style>
:root { --text:#292524; --text-muted:#57534E; --border:rgba(41,37,36,0.14); --brand:#92400E; --brand-soft:#FBF3E4; --radius:8px; --radius-card:12px; --s8:8px; --s16:16px; --s20:20px; --font:"Microsoft YaHei","PingFang SC",sans-serif; }
.widget { color:var(--text); font:400 14px/20px var(--font); width:100%; }
.card { box-sizing:border-box; width:100%; background:#fff; border:1px solid var(--border); border-radius:var(--radius-card); padding:var(--s16); }
</style>
<div class="widget" data-dynamic-ui-widget data-template="architecture-elements">
  <section class="card">
    <svg viewBox="0 0 680 300" style="width:684px;height:300px;display:block" role="img" aria-label="词要背着题进总目：闸机排队">
      <defs>
        <marker id="i1" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">
          <path d="M1 1 L7 4 L1 7 Z" fill="#57534E"/>
        </marker>
        <marker id="i2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">
          <path d="M1 1 L7 4 L1 7 Z" fill="#92400E"/>
        </marker>
      </defs>

      <!-- 排队的词块 -->
      <text x="60" y="52" font-size="11" fill="#57534E" text-anchor="middle" font-family="Microsoft YaHei">报来的词</text>
      <g font-size="11" fill="#292524" font-family="Microsoft YaHei" text-anchor="middle">
        <rect x="24" y="110" width="60" height="30" rx="4" fill="#FAF7F2" stroke="#A8A29E" stroke-width="1.1"/><text x="54" y="129">透气帽</text>
        <rect x="24" y="148" width="60" height="30" rx="4" fill="#FAF7F2" stroke="#A8A29E" stroke-width="1.1"/><text x="54" y="167">通气塞</text>
      </g>
      <path d="M88 126 H 128" fill="none" stroke="#78716C" stroke-width="1.3" marker-end="url(#i1)"/>

      <!-- 闸机 -->
      <rect x="132" y="84" width="120" height="120" rx="8" fill="#FBF3E4" stroke="#92400E" stroke-width="1.8"/>
      <rect x="146" y="100" width="92" height="42" rx="4" fill="#fff" stroke="#92400E" stroke-width="1"/>
      <text x="192" y="118" font-size="10.5" fill="#92400E" text-anchor="middle" font-family="Microsoft YaHei">这词背哪道题？</text>
      <text x="192" y="134" font-size="10.5" fill="#92400E" text-anchor="middle" font-family="Microsoft YaHei">没有题的不收</text>
      <line x1="132" y1="158" x2="252" y2="158" stroke="#92400E" stroke-width="2.4"/>
      <!-- 拦下的红块 -->
      <rect x="152" y="170" width="60" height="28" rx="4" fill="#FDE8E4" stroke="#C0392B" stroke-width="1.3" stroke-dasharray="3 2"/>
      <text x="182" y="188" font-size="11" fill="#C0392B" text-anchor="middle" font-family="Microsoft YaHei">"在跟"</text>
      <text x="192" y="216" font-size="10.5" fill="#C0392B" text-anchor="middle" font-family="Microsoft YaHei">答不上题 · 拦下挂账</text>

      <!-- 过闸绿道 -->
      <path d="M256 126 H 300" fill="none" stroke="#92400E" stroke-width="1.6" marker-end="url(#i2)"/>
      <text x="278" y="118" font-size="10.5" fill="#92400E" text-anchor="middle" font-family="Microsoft YaHei">过</text>

      <!-- 总目架 -->
      <g>
        <rect x="304" y="84" width="130" height="120" rx="6" fill="#FAF7F2" stroke="#78716C" stroke-width="1.4"/>
        <text x="369" y="104" font-size="11" fill="#57534E" text-anchor="middle" font-family="Microsoft YaHei">总目 · 第一分册</text>
        <g stroke="#A8A29E" stroke-width="0.9" fill="#fff">
          <rect x="320" y="116" width="20" height="72" rx="2"/><rect x="346" y="116" width="20" height="72" rx="2"/><rect x="372" y="116" width="20" height="72" rx="2"/><rect x="398" y="116" width="20" height="72" rx="2"/>
        </g>
        <g stroke="#D6CFC5" stroke-width="0.8">
          <line x1="322" y1="132" x2="338" y2="132"/><line x1="322" y1="148" x2="338" y2="148"/><line x1="322" y1="164" x2="338" y2="164"/>
          <line x1="374" y1="132" x2="390" y2="132"/><line x1="374" y1="148" x2="390" y2="148"/>
        </g>
      </g>

      <!-- 会签台 -->
      <path d="M438 126 H 474" fill="none" stroke="#78716C" stroke-width="1.3" marker-end="url(#i1)"/>
      <g>
        <rect x="478" y="94" width="100" height="100" rx="6" fill="#FAF7F2" stroke="#78716C" stroke-width="1.4"/>
        <text x="528" y="118" font-size="11" fill="#57534E" text-anchor="middle" font-family="Microsoft YaHei">OA 六口会签</text>
        <g fill="#fff" stroke="#A8A29E" stroke-width="1">
          <circle cx="500" cy="140" r="9"/><circle cx="528" cy="140" r="9"/><circle cx="556" cy="140" r="9"/>
          <circle cx="514" cy="166" r="9"/><circle cx="542" cy="166" r="9"/>
        </g>
        <text x="528" y="186" font-size="10.5" fill="#57534E" text-anchor="middle" font-family="Microsoft YaHei">签齐入柜 · 编号档〇三一</text>
      </g>

      <!-- 右侧数字 -->
      <path d="M582 126 H 606" fill="none" stroke="#78716C" stroke-width="1.3" marker-end="url(#i1)"/>
      <text x="616" y="118" font-size="13" fill="#92400E" font-weight="600" font-family="Microsoft YaHei">37 词</text>
      <text x="616" y="136" font-size="10.5" fill="#57534E" font-family="Microsoft YaHei">8 回会</text>

      <!-- 底注 -->
      <text x="340" y="270" font-size="11.5" fill="#57534E" text-anchor="middle" font-family="Microsoft YaHei">机器堆 67 组 188 码打底 · 人看章认凭据 · 二十四天立住第一分册（第17章）</text>
    </svg>
  </section>
</div>
