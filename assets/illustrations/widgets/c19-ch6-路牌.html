<style>
:root { --text:#292524; --text-muted:#57534E; --border:rgba(41,37,36,0.14); --brand:#92400E; --brand-soft:#FBF3E4; --radius:8px; --radius-card:12px; --s8:8px; --s16:16px; --s20:20px; --font:"Microsoft YaHei","PingFang SC",sans-serif; }
.widget { color:var(--text); font:400 14px/20px var(--font); width:100%; }
.card { box-sizing:border-box; width:100%; background:#fff; border:1px solid var(--border); border-radius:var(--radius-card); padding:var(--s16); }
</style>
<div class="widget" data-dynamic-ui-widget data-template="explanation-panel">
  <section class="card">
    <svg viewBox="0 0 680 230" style="width:684px;height:230px;display:block" role="img" aria-label="路牌指三个方向，走路的是人">
      <!-- 路牌杆 -->
      <line x1="150" y1="50" x2="150" y2="180" stroke="#78716C" stroke-width="3.5"/>
      <!-- 三块指牌 -->
      <g font-family="Microsoft YaHei" font-size="12" fill="#292524">
        <g><rect x="158" y="54" width="120" height="26" rx="4" fill="#FAF7F2" stroke="#A8A29E" stroke-width="1.2"/><path d="M278 54 L296 67 L278 80 Z" fill="#FAF7F2" stroke="#A8A29E" stroke-width="1.2"/><text x="212" y="72" text-anchor="middle">调用接口</text></g>
        <g><rect x="158" y="94" width="120" height="26" rx="4" fill="#FAF7F2" stroke="#A8A29E" stroke-width="1.2"/><path d="M278 94 L296 107 L278 120 Z" fill="#FAF7F2" stroke="#A8A29E" stroke-width="1.2"/><text x="212" y="112" text-anchor="middle">买套系统</text></g>
        <g><rect x="158" y="134" width="120" height="26" rx="4" fill="#FAF7F2" stroke="#A8A29E" stroke-width="1.2"/><path d="M278 134 L296 147 L278 160 Z" fill="#FAF7F2" stroke="#A8A29E" stroke-width="1.2"/><text x="212" y="152" text-anchor="middle">自己查库</text></g>
      </g>

      <!-- 行人：自己走中间的路 -->
      <g font-family="Microsoft YaHei">
        <!-- 人 -->
        <circle cx="470" cy="96" r="13" fill="#292524"/>
        <circle cx="465" cy="93" r="1.8" fill="#fff"/><circle cx="475" cy="93" r="1.8" fill="#fff"/>
        <path d="M470 109 V 150" stroke="#292524" stroke-width="3" stroke-linecap="round"/>
        <path d="M470 118 L448 134 M470 118 L492 134" stroke="#292524" stroke-width="2.6" stroke-linecap="round"/>
        <path d="M470 150 L456 186 M470 150 L484 186" stroke="#292524" stroke-width="2.6" stroke-linecap="round"/>
        <!-- 手里的本子 -->
        <rect x="488" y="122" width="26" height="18" rx="2" fill="#FBF3E4" stroke="#92400E" stroke-width="1.3" transform="rotate(8 501 131)"/>
        <!-- 脚下的路 -->
        <path d="M420 196 C 450 190, 490 190, 520 196" fill="none" stroke="#92400E" stroke-width="2" stroke-dasharray="7 5"/>
        <text x="470" y="216" font-size="11.5" fill="#92400E" text-anchor="middle" font-family="Microsoft YaHei">路，得自己一步一步走</text>
      </g>

      <!-- 左下注 -->
      <text x="150" y="216" font-size="11.5" fill="#57534E" text-anchor="middle" font-family="Microsoft YaHei">指路的是它（第6章）</text>
    </svg>
  </section>
</div>
