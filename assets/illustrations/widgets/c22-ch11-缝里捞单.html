<style>
:root { --text:#292524; --text-muted:#57534E; --border:rgba(41,37,36,0.14); --brand:#92400E; --brand-soft:#FBF3E4; --radius:8px; --radius-card:12px; --s16:16px; --font:"Microsoft YaHei","PingFang SC",sans-serif; }
.widget { color:var(--text); font:400 14px/20px var(--font); width:100%; }
.card { box-sizing:border-box; width:100%; background:#fff; border:1px solid var(--border); border-radius:var(--radius-card); padding:var(--s16); }
</style>
<div class="widget" data-dynamic-ui-widget data-template="explanation-panel">
  <section class="card">
    <svg viewBox="0 0 680 240" style="width:684px;height:240px;display:block" role="img" aria-label="接缝处的单子，钩子来捞">
      <!-- 两段传送带，中间留缝 -->
      <g>
        <rect x="40" y="120" width="240" height="18" rx="4" fill="#EFEAE3" stroke="#A8A29E" stroke-width="1.2"/>
        <rect x="420" y="120" width="220" height="18" rx="4" fill="#EFEAE3" stroke="#A8A29E" stroke-width="1.2"/>
        <!-- 滚轮 -->
        <g fill="#fff" stroke="#A8A29E" stroke-width="1">
          <circle cx="70" cy="138" r="5"/><circle cx="150" cy="138" r="5"/><circle cx="230" cy="138" r="5"/>
          <circle cx="460" cy="138" r="5"/><circle cx="540" cy="138" r="5"/><circle cx="614" cy="138" r="5"/>
        </g>
        <!-- 缝 -->
        <text x="340" y="136" font-size="12" fill="#C0392B" text-anchor="middle" font-family="Microsoft YaHei">缝</text>
      </g>
      <!-- 上面一格里写着该到的 5000 个 -->
      <g font-family="Microsoft YaHei" font-size="11.5" fill="#57534E">
        <text x="160" y="104" text-anchor="middle">单上写：5000 个</text>
        <text x="530" y="104" text-anchor="middle">实收：4980 个</text>
      </g>
      <!-- 半悬在缝里的单子 -->
      <g transform="rotate(-6 340 160)">
        <rect x="296" y="146" width="88" height="34" rx="3" fill="#FDE8E4" stroke="#C0392B" stroke-width="1.5" stroke-dasharray="4 3"/>
        <text x="340" y="168" font-size="11.5" fill="#C0392B" text-anchor="middle" font-family="Microsoft YaHei">差的 2 个</text>
      </g>
      <!-- 钩子手 -->
      <path d="M340 40 C 340 70, 342 88, 341 108" fill="none" stroke="#92400E" stroke-width="1.6"/>
      <path d="M336 108 C 330 118, 330 128, 338 136 L 344 130 C 338 126, 340 118, 344 114 Z" fill="#FBF3E4" stroke="#92400E" stroke-width="1.5"/>
      <text x="380" y="70" font-size="11.5" fill="#92400E" font-family="Microsoft YaHei">异常前置：单子别等掉下去再找</text>
      <!-- 底注 -->
      <text x="340" y="210" font-size="11.5" fill="#57534E" text-anchor="middle" font-family="Microsoft YaHei">客户不打电话，单子就躺在缝里 —— 红牌提前半天亮出来（第11章）</text>
    </svg>
  </section>
</div>
