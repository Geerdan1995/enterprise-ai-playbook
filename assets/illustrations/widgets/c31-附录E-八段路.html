<style>
:root { --text:#292524; --text-muted:#57534E; --border:rgba(41,37,36,0.14); --brand:#92400E; --brand-soft:#FBF3E4; --radius:8px; --radius-card:12px; --s16:16px; --font:"Microsoft YaHei","PingFang SC",sans-serif; }
.widget { color:var(--text); font:400 14px/20px var(--font); width:100%; }
.card { box-sizing:border-box; width:100%; background:#fff; border:1px solid var(--border); border-radius:var(--radius-card); padding:var(--s16); }
</style>
<div class="widget" data-dynamic-ui-widget data-template="explanation-panel">
  <section class="card">
    <svg viewBox="0 0 680 200" style="width:684px;height:200px;display:block" role="img" aria-label="把AI用起来的八段路">
      <defs>
        <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
          <path d="M1 1 L7 4 L1 7 Z" fill="#A8A29E"/>
        </marker>
      </defs>

      <!-- 路 -->
      <line x1="40" y1="100" x2="636" y2="100" stroke="#A8A29E" stroke-width="2" marker-end="url(#arr)"/>

      <!-- 八站 -->
      <g font-family="Microsoft YaHei" font-size="10.5" text-anchor="middle">
        <!-- 1 起点（深） -->
        <circle cx="50" cy="100" r="10" fill="#292524"/>
        <text x="50" y="104" fill="#FAF7F2" font-weight="600">1</text>
        <text x="50" y="70" fill="#292524" font-weight="600">挑一件疼事</text>

        <!-- 2 -->
        <circle cx="133" cy="100" r="9" fill="#FAF7F2" stroke="#A8A29E" stroke-width="1.4"/>
        <text x="133" y="104" fill="#57534E" font-weight="600">2</text>
        <text x="133" y="142" fill="#57534E">看清流程</text>

        <!-- 3 -->
        <circle cx="216" cy="100" r="9" fill="#FAF7F2" stroke="#A8A29E" stroke-width="1.4"/>
        <text x="216" y="104" fill="#57534E" font-weight="600">3</text>
        <text x="216" y="70" fill="#57534E">盘点家底</text>

        <!-- 4 -->
        <circle cx="299" cy="100" r="9" fill="#FAF7F2" stroke="#A8A29E" stroke-width="1.4"/>
        <text x="299" y="104" fill="#57534E" font-weight="600">4</text>
        <text x="299" y="142" fill="#57534E">划清分工</text>

        <!-- 5 -->
        <circle cx="382" cy="100" r="9" fill="#FAF7F2" stroke="#A8A29E" stroke-width="1.4"/>
        <text x="382" y="104" fill="#57534E" font-weight="600">5</text>
        <text x="382" y="70" fill="#57534E">上线之后</text>

        <!-- 6 -->
        <circle cx="465" cy="100" r="9" fill="#FAF7F2" stroke="#A8A29E" stroke-width="1.4"/>
        <text x="465" y="104" fill="#57534E" font-weight="600">6</text>
        <text x="465" y="142" fill="#57534E">人与组织</text>

        <!-- 7 -->
        <circle cx="548" cy="100" r="9" fill="#FAF7F2" stroke="#A8A29E" stroke-width="1.4"/>
        <text x="548" y="104" fill="#57534E" font-weight="600">7</text>
        <text x="548" y="70" fill="#57534E">模型安全</text>

        <!-- 8 收口（品牌棕） -->
        <circle cx="631" cy="100" r="10" fill="#92400E"/>
        <text x="631" y="104" fill="#FAF7F2" font-weight="600">8</text>
        <text x="631" y="142" fill="#92400E" font-weight="600">诚实算账</text>
      </g>

      <!-- 起讫的细注 -->
      <g font-family="Microsoft YaHei" font-size="10" fill="#78716C">
        <text x="40" y="176">从一件真疼的事起</text>
        <text x="640" y="176" text-anchor="end">到第二件事愿不愿意来</text>
      </g>
    </svg>
  </section>
</div>
