<style>
:root { --text:#292524; --text-muted:#57534E; --border:rgba(41,37,36,0.14); --brand:#92400E; --brand-soft:#FBF3E4; --font:"Microsoft YaHei","PingFang SC",sans-serif; }
.widget { color:var(--text); font:400 14px/20px var(--font); width:100%; }
.card { box-sizing:border-box; width:100%; background:#fff; border:1px solid var(--border); border-radius:12px; padding:8px 0 6px; }
</style>
<div class="widget" data-dynamic-ui-widget data-template="explanation-panel">
  <section class="card">
    <svg viewBox="0 0 680 392" style="width:684px;height:392px;display:block" role="img" aria-label="旧解法四层失效阶梯">
      <defs>
        <marker id="arrUp" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
          <path d="M1 1 L7 4 L1 7 Z" fill="#92400E"/>
        </marker>
        <marker id="arrR" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
          <path d="M1 1 L7 4 L1 7 Z" fill="#A8A29E"/>
        </marker>
      </defs>

      <!-- 顶部标题与溢出标签 -->
      <text x="20" y="26" font-family="Microsoft YaHei" font-size="12.5" font-weight="600" fill="#292524">旧解法 · 四层失效阶梯</text>
      <rect x="418" y="10" width="244" height="46" rx="10" fill="#FBF3E4" stroke="#92400E" stroke-width="1.5" stroke-dasharray="5 4"/>
      <text x="540" y="31" font-family="Microsoft YaHei" font-size="13" font-weight="700" fill="#92400E" text-anchor="middle">溢出＝AI接的部分</text>
      <text x="540" y="46" font-family="Microsoft YaHei" font-size="9" fill="#92400E" text-anchor="middle" opacity="0.85">旧解法合身 · 变量把它撑破之后</text>
      <path d="M 576 158 C 576 122 560 92 543 62" fill="none" stroke="#92400E" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrUp)"/>

      <!-- 四级台阶（同一地面 y=356，高度递增） -->
      <!-- 第一层 纯人扛 -->
      <rect x="20" y="264" width="152" height="92" rx="10" fill="#FAFAF9" stroke="rgba(41,37,36,0.12)"/>
      <g font-family="Microsoft YaHei" text-anchor="middle">
        <circle cx="56" cy="288" r="11" fill="#292524"/>
        <text x="56" y="292" font-size="10.5" fill="#FAF7F2" font-weight="600">1</text>
        <text x="112" y="292" font-size="12" font-weight="600" fill="#292524">纯人扛</text>
        <text x="96" y="312" font-size="9.5" fill="#78716C">能跑 · 人不能翻倍</text>
        <text x="96" y="332" font-size="9" fill="#78716C">NO.1·2·5·6·9·10</text>
        <text x="96" y="346" font-size="9" fill="#78716C">NO.13·18·23·24</text>
      </g>

      <!-- 第二层 买过软件没接住 -->
      <rect x="180" y="228" width="152" height="128" rx="10" fill="#FAFAF9" stroke="rgba(41,37,36,0.12)"/>
      <g font-family="Microsoft YaHei" text-anchor="middle">
        <circle cx="216" cy="252" r="11" fill="#FAF7F2" stroke="#92400E" stroke-width="1.5"/>
        <text x="216" y="256" font-size="10.5" fill="#292524" font-weight="600">2</text>
        <text x="272" y="252" font-size="11" font-weight="600" fill="#292524">买过软件·没接住</text>
        <text x="256" y="276" font-size="9.5" fill="#78716C">字段装不下现场</text>
        <text x="256" y="296" font-size="9" fill="#78716C">NO.3·8·11·14·17</text>
        <text x="256" y="310" font-size="9" fill="#78716C">NO.19·20</text>
      </g>

      <!-- 第三层 自试AI停在半途 -->
      <rect x="340" y="192" width="152" height="164" rx="10" fill="#FAFAF9" stroke="rgba(41,37,36,0.12)"/>
      <g font-family="Microsoft YaHei" text-anchor="middle">
        <circle cx="376" cy="216" r="11" fill="#FAF7F2" stroke="#92400E" stroke-width="1.5"/>
        <text x="376" y="220" font-size="10.5" fill="#292524" font-weight="600">3</text>
        <text x="432" y="216" font-size="11" font-weight="600" fill="#292524">自试AI·停在半途</text>
        <text x="416" y="240" font-size="9.5" fill="#78716C">能跑 ≠ 生产使用</text>
        <text x="416" y="260" font-size="9" fill="#78716C">NO.7·12·15·16</text>
      </g>

      <!-- 第四层 专业工具强人当串联件 -->
      <rect x="500" y="156" width="152" height="200" rx="10" fill="#FAFAF9" stroke="rgba(41,37,36,0.12)"/>
      <g font-family="Microsoft YaHei" text-anchor="middle">
        <circle cx="536" cy="180" r="11" fill="#FAF7F2" stroke="#92400E" stroke-width="1.5"/>
        <text x="536" y="184" font-size="10.5" fill="#292524" font-weight="600">4</text>
        <text x="584" y="180" font-size="10.5" font-weight="600" fill="#292524">专业工具强</text>
        <text x="584" y="196" font-size="10.5" font-weight="600" fill="#292524">人当串联件</text>
        <text x="576" y="220" font-size="9.5" fill="#78716C">缝多 · 人先垮</text>
        <text x="576" y="240" font-size="9" fill="#78716C">NO.4·21·22</text>
      </g>

      <!-- 底部地轴 -->
      <line x1="20" y1="372" x2="652" y2="372" stroke="#A8A29E" stroke-width="1.6" marker-end="url(#arrR)"/>
      <text x="640" y="388" font-family="Microsoft YaHei" font-size="9" fill="#A8A29E" text-anchor="end">旧解法里系统的分量</text>
    </svg>
  </section>
</div>
