<style>
:root { --text:#292524; --text-muted:#57534E; --border:rgba(41,37,36,0.14); --brand:#92400E; --brand-soft:#FBF3E4; --radius:8px; --radius-card:12px; --s8:8px; --s16:16px; --s20:20px; --font:"Microsoft YaHei","PingFang SC",sans-serif; }
.widget { color:var(--text); font:400 14px/20px var(--font); width:100%; }
.card { box-sizing:border-box; width:100%; background:#fff; border:1px solid var(--border); border-radius:var(--radius-card); padding:var(--s16); }
</style>
<div class="widget" data-dynamic-ui-widget data-template="explanation-panel">
  <section class="card">
    <svg viewBox="0 0 680 316" style="width:684px;height:316px;display:block" role="img" aria-label="一把梭翻车与五段流水线">
      <defs>
        <marker id="w1" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">
          <path d="M1 1 L7 4 L1 7 Z" fill="#57534E"/>
        </marker>
      </defs>

      <!-- 上路：一把梭 -->
      <text x="60" y="34" font-size="12" fill="#57534E" font-family="Microsoft YaHei">一把梭：图纸进，价直接出</text>
      <rect x="36" y="44" width="46" height="30" rx="4" fill="#F3EEE5" stroke="#78716C" stroke-width="1.2"/>
      <text x="59" y="63" font-size="11" fill="#292524" text-anchor="middle" font-family="Microsoft YaHei">图纸</text>
      <path d="M86 59 H136" fill="none" stroke="#78716C" stroke-width="1.4" marker-end="url(#w1)"/>
      <rect x="140" y="44" width="230" height="30" rx="6" fill="#EFEAE3" stroke="#A8A29E" stroke-width="1.2"/>
      <text x="255" y="63" font-size="11" fill="#57534E" text-anchor="middle" font-family="Microsoft YaHei">读图 + 算成本 + 套毛利，中间不用人</text>
      <!-- 爆炸点 -->
      <g stroke="#C0392B" stroke-width="2" stroke-linecap="round">
        <path d="M370 52 L382 40 M382 66 L370 78 M382 52 L394 40 M394 66 L382 78"/>
        <path d="M376 59 L388 59 M382 53 L382 71"/>
      </g>
      <path d="M398 59 H416" fill="none" stroke="#C0392B" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#w1)"/>
      <rect x="420" y="42" width="52" height="32" rx="4" fill="#FDE8E4" stroke="#C0392B" stroke-width="1.4"/>
      <text x="446" y="62" font-size="11" fill="#C0392B" text-anchor="middle" font-family="Microsoft YaHei">42.8 万</text>
      <text x="492" y="52" font-size="11" fill="#57534E" font-family="Microsoft YaHei">实际成本</text>
      <text x="492" y="68" font-size="11" fill="#292524" font-family="Microsoft YaHei">39.2 万</text>
      <text x="492" y="88" font-size="10.5" fill="#C0392B" font-family="Microsoft YaHei">漏磨齿外协 3.8 万 · 工时少 112 个</text>

      <!-- 分隔 -->
      <line x1="36" y1="108" x2="644" y2="108" stroke="rgba(41,37,36,0.1)" stroke-width="1"/>

      <!-- 下路：五段流水线 -->
      <text x="60" y="136" font-size="12" fill="#92400E" font-family="Microsoft YaHei">改成流水线：模型只干第一段</text>
      <!-- 传送带 -->
      <rect x="36" y="196" width="600" height="10" rx="5" fill="#EFEAE3"/>
      <g fill="#fff" stroke="#A8A29E" stroke-width="1">
        <circle cx="70" cy="206" r="5"/><circle cx="190" cy="206" r="5"/><circle cx="310" cy="206" r="5"/><circle cx="430" cy="206" r="5"/><circle cx="550" cy="206" r="5"/><circle cx="620" cy="206" r="5"/>
      </g>
      <!-- 工位 1：读图（普通灰） -->
      <rect x="44" y="150" width="100" height="40" rx="6" fill="#fff" stroke="#A8A29E" stroke-width="1.2"/>
      <text x="94" y="168" font-size="11.5" fill="#292524" text-anchor="middle" font-family="Microsoft YaHei">读图</text>
      <text x="94" y="183" font-size="10" fill="#57534E" text-anchor="middle" font-family="Microsoft YaHei">图纸进来</text>
      <path d="M148 170 H176" fill="none" stroke="#78716C" stroke-width="1.3" marker-end="url(#w1)"/>
      <!-- 工位 2：图纸变表（亮灯，唯一模型段） -->
      <rect x="180" y="144" width="120" height="46" rx="6" fill="#FBF3E4" stroke="#92400E" stroke-width="1.8"/>
      <text x="240" y="163" font-size="11.5" fill="#92400E" text-anchor="middle" font-family="Microsoft YaHei" font-weight="600">图纸变表</text>
      <text x="240" y="181" font-size="10" fill="#92400E" text-anchor="middle" font-family="Microsoft YaHei">模型只干这一段</text>
      <!-- 亮灯标 -->
      <circle cx="290" cy="144" r="5" fill="#EFAA17"/>
      <path d="M152 170 H176" fill="none"/>
      <path d="M304 170 H332" fill="none" stroke="#78716C" stroke-width="1.3" marker-end="url(#w1)"/>
      <!-- 工位 3 -->
      <rect x="336" y="150" width="100" height="40" rx="6" fill="#fff" stroke="#A8A29E" stroke-width="1.2"/>
      <text x="386" y="168" font-size="11.5" fill="#292524" text-anchor="middle" font-family="Microsoft YaHei">相似单匹配</text>
      <text x="386" y="183" font-size="10" fill="#57534E" text-anchor="middle" font-family="Microsoft YaHei">对物料库</text>
      <path d="M440 170 H468" fill="none" stroke="#78716C" stroke-width="1.3" marker-end="url(#w1)"/>
      <!-- 工位 4 -->
      <rect x="472" y="150" width="100" height="40" rx="6" fill="#fff" stroke="#A8A29E" stroke-width="1.2"/>
      <text x="522" y="168" font-size="11.5" fill="#292524" text-anchor="middle" font-family="Microsoft YaHei">经验规则 67 条</text>
      <text x="522" y="183" font-size="10" fill="#57534E" text-anchor="middle" font-family="Microsoft YaHei">老秦的本子</text>
      <path d="M576 170 H596" fill="none" stroke="#78716C" stroke-width="1.3" marker-end="url(#w1)"/>
      <!-- 工位 5 -->
      <rect x="600" y="150" width="52" height="40" rx="6" fill="#fff" stroke="#A8A29E" stroke-width="1.2"/>
      <text x="626" y="168" font-size="11.5" fill="#292524" text-anchor="middle" font-family="Microsoft YaHei">三档价</text>
      <text x="626" y="183" font-size="10" fill="#57534E" text-anchor="middle" font-family="Microsoft YaHei">人工校准</text>
      <!-- 回填虚线 -->
      <path d="M626 194 V 232 H 240 V 194" fill="none" stroke="#92400E" stroke-width="1.3" stroke-dasharray="5 4"/>
      <text x="433" y="250" font-size="11" fill="#92400E" text-anchor="middle" font-family="Microsoft YaHei">校准过的单回填库 —— 书上管这个叫数据飞轮</text>
      <!-- 底注 -->
      <text x="36" y="290" font-size="11.5" fill="#57534E" font-family="Microsoft YaHei">改完后：常规单一天以内 · 老秦一个礼拜整两天 → 剩小半天（第10章）</text>
    </svg>
  </section>
</div>
