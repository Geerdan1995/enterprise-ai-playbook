<style>

.widget { color:var(--text); font:400 14px/20px var(--font); width:100%; }
.card { box-sizing:border-box; width:100%; background:#fff; border:1px solid var(--border); border-radius:var(--radius-card); padding:var(--s20); }
</style>

        <g><rect x="472" y="146" width="90" height="34" rx="4" fill="#fff" stroke="#A8A29E" stroke-width="1.2" transform="rotate(-2 517 163)"/><text x="517" y="168" text-anchor="middle" transform="rotate(-2 517 163)">晋北煤业</text></g>
