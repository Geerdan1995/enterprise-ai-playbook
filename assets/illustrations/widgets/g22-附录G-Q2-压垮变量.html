<style>
:root { --text:#292524; --text-muted:#57534E; --border:rgba(41,37,36,0.14); --brand:#92400E; --brand-soft:#FBF3E4; --font:"Microsoft YaHei","PingFang SC",sans-serif; }
.widget { color:var(--text); font:400 14px/20px var(--font); width:100%; }
.card { box-sizing:border-box; width:100%; background:#fff; border:1px solid var(--border); border-radius:12px; padding:8px 0 6px; }
</style>
<div class="widget" data-dynamic-ui-widget data-template="explanation-panel">
  <section class="card">
    <svg viewBox="0 0 680 252" style="width:684px;height:252px;display:block" role="img" aria-label="压垮旧解法的三个变量">
      <text x="20" y="26" font-family="Microsoft YaHei" font-size="12.5" font-weight="600" fill="#292524">压垮旧解法的三根变量</text>

      <!-- 卡一：规模 -->
      <rect x="20" y="38" width="204" height="168" rx="10" fill="#FAFAF9" stroke="rgba(41,37,36,0.12)"/>
      <rect x="64" y="50" width="116" height="22" rx="11" fill="#292524"/>
      <text x="122" y="65" font-family="Microsoft YaHei" font-size="11" font-weight="600" fill="#FAF7F2" text-anchor="middle">规模</text>
      <text x="122" y="88" font-family="Microsoft YaHei" font-size="9.5" fill="#78716C" text-anchor="middle">数量涨 · 人不翻倍</text>
      <g font-family="Microsoft YaHei" font-size="9" fill="#292524">
        <text x="36" y="110">业务量翻倍｜NO.9</text>
        <text x="36" y="128">订单客户在涨｜NO.5·12·15·17</text>
        <text x="36" y="146">门店项目集中｜NO.10·21·19·22</text>
        <text x="36" y="164">跨境体量上来｜NO.6·24</text>
        <text x="36" y="182">管理层要实时看｜NO.18</text>
      </g>

      <!-- 卡二：非结构化 -->
      <rect x="240" y="38" width="204" height="168" rx="10" fill="#FAFAF9" stroke="rgba(41,37,36,0.12)"/>
      <rect x="284" y="50" width="116" height="22" rx="11" fill="#292524"/>
      <text x="342" y="65" font-family="Microsoft YaHei" font-size="11" font-weight="600" fill="#FAF7F2" text-anchor="middle">非结构化</text>
      <text x="342" y="88" font-family="Microsoft YaHei" font-size="9.5" fill="#78716C" text-anchor="middle">字段装不下材料</text>
      <g font-family="Microsoft YaHei" font-size="9" fill="#292524">
        <text x="256" y="110">图纸五花八门｜NO.17</text>
        <text x="256" y="128">手写凭证口径杂｜NO.24</text>
        <text x="256" y="146">名称单位混乱｜NO.8</text>
        <text x="256" y="164">表单装不下｜NO.19·3</text>
        <text x="256" y="182">写不成需求文档｜NO.11·13</text>
      </g>

      <!-- 卡三：经验不可复制 -->
      <rect x="460" y="38" width="204" height="168" rx="10" fill="#FAFAF9" stroke="rgba(41,37,36,0.12)"/>
      <rect x="489" y="50" width="146" height="22" rx="11" fill="#292524"/>
      <text x="562" y="65" font-family="Microsoft YaHei" font-size="11" font-weight="600" fill="#FAF7F2" text-anchor="middle">经验不可复制</text>
      <text x="562" y="88" font-family="Microsoft YaHei" font-size="9.5" fill="#78716C" text-anchor="middle">知识跟着人走</text>
      <g font-family="Microsoft YaHei" font-size="9" fill="#292524">
        <text x="476" y="110">老师傅要退休｜NO.1</text>
        <text x="476" y="128">经验多年长成｜NO.6·5</text>
        <text x="476" y="146">能力在少数人｜NO.17</text>
        <text x="476" y="164">培养周期长｜NO.21·18</text>
        <text x="476" y="182">知识没进系统｜NO.14·15</text>
      </g>

      <!-- 底部第四种变化 -->
      <rect x="20" y="218" width="644" height="26" rx="8" fill="#FBF3E4"/>
      <text x="342" y="235" font-family="Microsoft YaHei" font-size="9.5" fill="#92400E" text-anchor="middle">三样之外的第四种变化：市场周期｜NO.2 · NO.23</text>
    </svg>
  </section>
</div>
