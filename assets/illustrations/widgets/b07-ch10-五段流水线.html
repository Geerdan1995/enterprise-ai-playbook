<style>
:root { --text:#292524; --text-muted:#78716C; --border:rgba(41,37,36,0.14); --brand:#92400E; --brand-soft:#FBF3E4; --radius:8px; --radius-card:12px; --radius-full:999px; --s4:4px; --s8:8px; --s12:12px; --s16:16px; --s20:20px; --font:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif; }
.widget { color:var(--text); font:400 14px/20px var(--font); width:100%; }
.card { box-sizing:border-box; width:100%; background:#fff; border:1px solid var(--border); border-radius:var(--radius-card); padding:var(--s20); }
.dead { display:flex; align-items:center; gap:var(--s12); border:1px solid var(--border); border-radius:var(--radius); padding:var(--s12) var(--s16); background:var(--surface); }
.dead .x { font:600 16px/24px var(--font); color:var(--text-muted); }
.dead .t b { font:500 13px/20px var(--font); color:var(--text); }
.dead .t span { display:block; font:400 12px/18px var(--font); color:var(--text-muted); }
.flow { margin-top:var(--s16); display:grid; grid-template-columns:repeat(5,1fr); gap:var(--s8); }
.step { border:1.5px solid var(--brand); border-radius:var(--radius); padding:var(--s12); background:var(--brand-soft); text-align:center; }
.step i { display:block; font:400 11px/16px var(--font); color:var(--text-muted); font-style:normal; }
.step b { display:block; margin-top:var(--s4); font:500 13px/18px var(--font); color:var(--brand-text); }
.step[data-mine="1"] { border-color:var(--border); background:#fff; }
.step[data-mine="1"] b, .step[data-mine="1"] i { color:var(--text-muted); }
.flowArrow { display:flex; align-items:center; justify-content:center; color:var(--text-muted); font-size:14px; }
.loop { margin-top:var(--s12); display:flex; align-items:center; gap:var(--s8); }
.loopLine { flex:1; border-top:1.5px dashed var(--brand); position:relative; }
.loopLine::after { content:""; position:absolute; right:0; top:-4px; border:4px solid transparent; border-left-color:var(--brand); }
.loopLbl { font:400 12px/18px var(--font); color:var(--brand); }
.back { margin-top:var(--s12); display:flex; gap:var(--s8); flex-wrap:wrap; }
.bpill { padding:var(--s4) var(--s12); border:1px solid var(--border); border-radius:var(--radius-full); font:400 12px/18px var(--font); color:var(--text-muted); background:var(--surface); }
.bpill b { color:var(--text); font-weight:500; }
</style>
<div class="widget" data-dynamic-ui-widget data-template="architecture-elements">
  <section class="card">
    <div class="dead"><span class="x">✕</span><span class="t"><b>一把梭：图纸进，价直接出</b><span>翻车——报价 42.8 万，实际成本 39.2 万：漏了磨齿外协 3.8 万，工时少算 112 个</span></span></div>
    <div class="flow">
      <div class="step" data-mine="1"><i>图纸进来</i><b>读图</b></div>
      <div class="step"><i>模型只干这一段</i><b>图纸变表</b></div>
      <div class="step"><i>对物料库</i><b>相似单匹配</b></div>
      <div class="step"><i>老秦 67 条</i><b>经验规则</b></div>
      <div class="step"><i>三档价</i><b>人工校准</b></div>
    </div>
    <div class="loop"><span class="loopLbl">校准过的单回填库——书上管这个叫数据飞轮</span><span class="loopLine"></span></div>
    <div class="back">
      <span class="bpill"><b>常规单</b>一天以内</span>
      <span class="bpill"><b>老秦</b>一个礼拜整两天 → 剩小半天</span>
      <span class="bpill">"它认图，不认厂"（第10章）</span>
    </div>
  </section>
</div>
