<style>
:root { --text:#292524; --text-muted:#57534E; --border:rgba(41,37,36,0.14); --brand:#92400E; --brand-soft:#FBF3E4; --radius:8px; --radius-card:12px; --s8:8px; --s16:16px; --s20:20px; --font:"Microsoft YaHei","PingFang SC",sans-serif; }
.widget { color:var(--text); font:400 14px/20px var(--font); width:100%; }
.card { box-sizing:border-box; width:100%; background:#fff; border:1px solid var(--border); border-radius:var(--radius-card); padding:var(--s16); }
</style>
<div class="widget" data-dynamic-ui-widget data-template="comparison-cards">
  <section class="card">
    <svg viewBox="0 0 680 300" style="width:684px;height:300px;display:block" role="img" aria-label="五个名字，分三堆：章说了算">
      <defs>
        <marker id="j1" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">
          <path d="M1 1 L7 4 L1 7 Z" fill="#57534E"/>
        </marker>
        <marker id="j2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">
          <path d="M1 1 L7 4 L1 7 Z" fill="#92400E"/>
        </marker>
      </defs>

      <!-- 顶部：机器堆名（输入） -->
      <text x="340" y="30" font-size="11.5" fill="#57534E" text-anchor="middle" font-family="Microsoft YaHei">机器按名字相似度堆出来的五块牌</text>

      <!-- 五块名牌 -->
      <g font-size="11.5" font-family="Microsoft YaHei" text-anchor="middle">
        <rect x="42"  y="46" width="108" height="34" rx="4" fill="#FAF7F2" stroke="#A8A29E" stroke-width="1.2"/><text x="96"  y="67" fill="#292524">华信轴承</text>
        <rect x="166" y="46" width="108" height="34" rx="4" fill="#FAF7F2" stroke="#A8A29E" stroke-width="1.2"/><text x="220" y="67" fill="#292524">HX-ZC</text>
        <rect x="290" y="46" width="108" height="34" rx="4" fill="#FAF7F2" stroke="#A8A29E" stroke-width="1.2"/><text x="344" y="67" fill="#292524">华信传动科技</text>
        <rect x="414" y="46" width="108" height="34" rx="4" fill="#FAF7F2" stroke="#A8A29E" stroke-width="1.2"/><text x="468" y="67" fill="#292524">华信传动设备</text>
        <rect x="538" y="46" width="108" height="34" rx="4" fill="#FAF7F2" stroke="#A8A29E" stroke-width="1.2"/><text x="592" y="67" fill="#292524">华信精工</text>
      </g>

      <!-- 分流箭头 -->
      <path d="M96 84 C 96 110, 150 118, 196 130" fill="none" stroke="#78716C" stroke-width="1.3" marker-end="url(#j1)"/>
      <path d="M220 84 C 220 110, 230 118, 238 130" fill="none" stroke="#78716C" stroke-width="1.3" marker-end="url(#j1)"/>
      <path d="M344 84 C 344 110, 334 118, 326 130" fill="none" stroke="#78716C" stroke-width="1.3" marker-end="url(#j1)"/>
      <path d="M468 84 C 468 112, 480 122, 488 136" fill="none" stroke="#92400E" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#j2)"/>
      <path d="M592 84 C 592 112, 580 122, 572 136" fill="none" stroke="#92400E" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#j2)"/>

      <!-- 堆1：洛阳三牌一户 -->
      <g>
        <rect x="150" y="136" width="220" height="92" rx="8" fill="#FBF3E4" stroke="#92400E" stroke-width="1.6"/>
        <text x="260" y="158" font-size="12" fill="#92400E" text-anchor="middle" font-family="Microsoft YaHei" font-weight="600">洛阳 · 一户</text>
        <!-- 三块牌叠放 + 章印 -->
        <g font-size="11" fill="#292524" font-family="Microsoft YaHei">
          <rect x="176" y="168" width="98" height="24" rx="3" fill="#fff" stroke="#A8A29E" stroke-width="1"/><text x="225" y="184" text-anchor="middle">华信轴承</text>
          <rect x="182" y="176" width="98" height="24" rx="3" fill="#fff" stroke="#A8A29E" stroke-width="1"/><text x="231" y="192" text-anchor="middle">HX-ZC</text>
          <rect x="188" y="184" width="98" height="24" rx="3" fill="#fff" stroke="#A8A29E" stroke-width="1"/><text x="237" y="200" text-anchor="middle">华信传动科技</text>
        </g>
        <!-- 章印 -->
        <circle cx="322" cy="192" r="16" fill="none" stroke="#92400E" stroke-width="1.6"/>
        <text x="322" y="197" font-size="10" fill="#92400E" text-anchor="middle" font-family="Microsoft YaHei">章符</text>
      </g>

      <!-- 堆2：常州另立（0.96 机器排第一） -->
      <g>
        <rect x="416" y="140" width="112" height="86" rx="8" fill="#fff" stroke="#A8A29E" stroke-width="1.2"/>
        <text x="472" y="162" font-size="12" fill="#292524" text-anchor="middle" font-family="Microsoft YaHei">常州 · 另立一户</text>
        <rect x="444" y="174" width="100" height="24" rx="3" fill="#FAF7F2" stroke="#A8A29E" stroke-width="1"/>
        <text x="494" y="190" font-size="11" fill="#292524" text-anchor="middle" font-family="Microsoft YaHei">华信传动设备</text>
        <text x="472" y="216" font-size="10.5" fill="#C0392B" text-anchor="middle" font-family="Microsoft YaHei">相似 0.96 排第一 —— 章不符，真分</text>
      </g>

      <!-- 堆3：顺德并入鼎恒（0.89） -->
      <g>
        <rect x="540" y="140" width="112" height="86" rx="8" fill="#fff" stroke="#A8A29E" stroke-width="1.2"/>
        <text x="596" y="162" font-size="12" fill="#292524" text-anchor="middle" font-family="Microsoft YaHei">顺德 · 并入鼎恒</text>
        <rect x="560" y="174" width="88" height="24" rx="3" fill="#FAF7F2" stroke="#A8A29E" stroke-width="1"/>
        <text x="604" y="190" font-size="11" fill="#292524" text-anchor="middle" font-family="Microsoft YaHei">华信精工</text>
        <text x="596" y="216" font-size="10.5" fill="#92400E" text-anchor="middle" font-family="Microsoft YaHei">相似 0.89 —— 同一经营者，真并</text>
      </g>

      <!-- 底行总账 -->
      <text x="340" y="264" font-size="11.5" fill="#57534E" text-anchor="middle" font-family="Microsoft YaHei">912 码：在用 695 归 511 户 · 并 44 · 另立 10 · 挂账 13 · 死码 217（第18章）</text>
    </svg>
  </section>
</div>
