<style>
:root { --text:#292524; --text-muted:#57534E; --border:rgba(41,37,36,0.14); --brand:#92400E; --brand-soft:#FBF3E4; --radius:8px; --radius-card:12px; --s8:8px; --s16:16px; --s20:20px; --font:"Microsoft YaHei","PingFang SC",sans-serif; }
.widget { color:var(--text); font:400 14px/20px var(--font); width:100%; }
.card { box-sizing:border-box; width:100%; background:#fff; border:1px solid var(--border); border-radius:var(--radius-card); padding:var(--s16); }
</style>
<div class="widget" data-dynamic-ui-widget data-template="explanation-panel">
  <section class="card">
    <svg viewBox="0 0 680 260" style="width:684px;height:260px;display:block" role="img" aria-label="两万三千份文件过三岔分拣台">
      <defs>
        <marker id="k1" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">
          <path d="M1 1 L7 4 L1 7 Z" fill="#78716C"/>
        </marker>
        <marker id="k2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">
          <path d="M1 1 L7 4 L1 7 Z" fill="#C0392B"/>
        </marker>
        <marker id="k3" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">
          <path d="M1 1 L7 4 L1 7 Z" fill="#92400E"/>
        </marker>
      </defs>

      <!-- 左：文件流 -->
      <text x="70" y="40" font-size="12" fill="#57534E" text-anchor="middle" font-family="Microsoft YaHei">两万三千份</text>
      <g fill="#DDD6CE" stroke="#A8A29E" stroke-width="0.8">
        <rect x="36" y="56" width="20" height="14" rx="2"/><rect x="60" y="56" width="20" height="14" rx="2"/><rect x="84" y="56" width="20" height="14" rx="2"/>
        <rect x="48" y="74" width="20" height="14" rx="2"/><rect x="72" y="74" width="20" height="14" rx="2"/>
        <rect x="36" y="92" width="20" height="14" rx="2"/><rect x="60" y="92" width="20" height="14" rx="2"/><rect x="84" y="92" width="20" height="14" rx="2"/>
      </g>
      <!-- 传送带 -->
      <path d="M112 106 H 268" fill="none" stroke="#78716C" stroke-width="1.5" marker-end="url(#k1)"/>
      <rect x="130" y="96" width="120" height="20" rx="4" fill="#F3EEE5" stroke="#A8A29E" stroke-width="1"/>
      <text x="190" y="90" font-size="11" fill="#57534E" text-anchor="middle" font-family="Microsoft YaHei">初筛 + 抽检</text>

      <!-- 分拣台（三角岔口） -->
      <path d="M272 106 L 330 106 M 330 106 L 430 56 M 330 106 L 430 106 M 330 106 L 430 166" fill="none" stroke="#78716C" stroke-width="1.4"/>
      <circle cx="330" cy="106" r="5" fill="#92400E"/>

      <!-- 三向出口 -->
      <!-- 上：入库 -->
      <path d="M436 52 H 486" fill="none" stroke="#92400E" stroke-width="1.5" marker-end="url(#k3)"/>
      <rect x="492" y="30" width="150" height="46" rx="6" fill="#FBF3E4" stroke="#92400E" stroke-width="1.5"/>
      <text x="567" y="50" font-size="12.5" fill="#92400E" text-anchor="middle" font-family="Microsoft YaHei" font-weight="600">入库 · 12,400 份</text>
      <text x="567" y="68" font-size="10.5" fill="#57534E" text-anchor="middle" font-family="Microsoft YaHei">现行的，问答只认这些</text>
      <!-- 中：存疑 -->
      <path d="M436 106 H 486" fill="none" stroke="#78716C" stroke-width="1.5" marker-end="url(#k1)"/>
      <rect x="492" y="86" width="150" height="46" rx="6" fill="#FAF7F2" stroke="#A8A29E" stroke-width="1.3"/>
      <text x="567" y="106" font-size="12.5" fill="#292524" text-anchor="middle" font-family="Microsoft YaHei" font-weight="500">待检筐 · 3,800 份</text>
      <text x="567" y="124" font-size="10.5" fill="#57534E" text-anchor="middle" font-family="Microsoft YaHei">新旧并存的，一件一件核</text>
      <!-- 下：作废 -->
      <path d="M436 162 H 486" fill="none" stroke="#C0392B" stroke-width="1.5" marker-end="url(#k2)"/>
      <rect x="492" y="146" width="150" height="46" rx="6" fill="#FDE8E4" stroke="#C0392B" stroke-width="1.4"/>
      <text x="567" y="166" font-size="12.5" fill="#C0392B" text-anchor="middle" font-family="Microsoft YaHei" font-weight="600">挡外 · 6,800 份</text>
      <text x="567" y="184" font-size="10.5" fill="#C0392B" text-anchor="middle" font-family="Microsoft YaHei">作废的，机器再也够不着</text>

      <!-- 底注 -->
      <text x="340" y="234" font-size="11.5" fill="#57534E" text-anchor="middle" font-family="Microsoft YaHei">抽样 500 份摸底起步：作废 47 · 现行 91 · 新旧并存 133 · 重复 21 · 状态栏空白 229（第4章）</text>
    </svg>
  </section>
</div>
