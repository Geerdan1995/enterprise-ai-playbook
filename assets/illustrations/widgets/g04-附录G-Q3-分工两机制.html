<style>
:root { --text:#292524; --text-muted:#57534E; --border:rgba(41,37,36,0.14); --brand:#92400E; --brand-soft:#FBF3E4; --font:"Microsoft YaHei","PingFang SC",sans-serif; }
.widget { color:var(--text); font:400 14px/20px var(--font); width:100%; }
.card { box-sizing:border-box; width:100%; background:#fff; border:1px solid var(--border); border-radius:12px; padding:10px 0 8px; }
</style>
<div class="widget" data-dynamic-ui-widget data-template="explanation-panel">
  <section class="card">
    <svg viewBox="0 0 680 252" style="width:684px;height:252px;display:block" role="img" aria-label="定分工的两个机制：NO.17两段式与NO.6双车道">
      <defs>
        <marker id="arr4" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">
          <path d="M1 1 L7 4 L1 7 Z" fill="#A8A29E"/>
        </marker>
        <marker id="arr4r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">
          <path d="M1 1 L7 4 L1 7 Z" fill="#B45309"/>
        </marker>
      </defs>
      <g font-family="Microsoft YaHei">
        <!-- =左panel：NO.17 端到端之死→两段式 = -->
        <text x="14" y="20" font-size="10.5" fill="#78716C">NO.17 · 非标制造报价</text>

        <!-- 第一版：端到端（废） -->
        <text x="14" y="46" font-size="10" fill="#A8A29E">第一版</text>
        <rect x="14" y="56" width="86" height="26" rx="6" fill="#FAFAF9" stroke="rgba(41,37,36,0.12)"/>
        <text x="57" y="73" font-size="10.5" fill="#57534E" text-anchor="middle" font-weight="600">图纸进去</text>
        <line x1="100" y1="69" x2="152" y2="69" stroke="#D6D3D1" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arr4)"/>
        <text x="126" y="60" font-size="9" fill="#A8A29E" text-anchor="middle">端到端</text>
        <rect x="152" y="56" width="118" height="26" rx="6" fill="#FAFAF9" stroke="rgba(41,37,36,0.12)"/>
        <text x="211" y="73" font-size="10.5" fill="#57534E" text-anchor="middle" font-weight="600">报价出来</text>
        <text x="211" y="96" font-size="9.5" fill="#92400E" text-anchor="middle">对不上真实成本</text>

        <!-- 改后：两段式 -->
        <text x="14" y="124" font-size="10" fill="#78716C">改后·两段</text>
        <rect x="14" y="134" width="72" height="40" rx="6" fill="#FAFAF9" stroke="rgba(41,37,36,0.12)"/>
        <text x="50" y="150" font-size="10.5" fill="#292524" text-anchor="middle" font-weight="600">图纸</text>
        <text x="50" y="164" font-size="8.5" fill="#78716C" text-anchor="middle">同一张</text>
        <line x1="86" y1="154" x2="100" y2="154" stroke="#A8A29E" stroke-width="1.6" marker-end="url(#arr4)"/>
        <rect x="100" y="134" width="82" height="40" rx="6" fill="#FBF3E4" stroke="rgba(146,64,14,0.25)"/>
        <text x="141" y="150" font-size="10.5" fill="#92400E" text-anchor="middle" font-weight="600">模型</text>
        <text x="141" y="164" font-size="8.5" fill="#92400E" text-anchor="middle">只做结构化</text>
        <line x1="182" y1="154" x2="196" y2="154" stroke="#A8A29E" stroke-width="1.6" marker-end="url(#arr4)"/>
        <rect x="196" y="134" width="90" height="40" rx="6" fill="#FBF3E4" stroke="rgba(146,64,14,0.25)"/>
        <text x="241" y="150" font-size="10.5" fill="#92400E" text-anchor="middle" font-weight="600">物料规则库</text>
        <text x="241" y="164" font-size="8.5" fill="#92400E" text-anchor="middle">报价匹配</text>
        <line x1="286" y1="154" x2="300" y2="154" stroke="#A8A29E" stroke-width="1.6" marker-end="url(#arr4)"/>
        <rect x="300" y="134" width="0" height="0" fill="none"/>

        <!-- 第二排续：人工校准→对外（受宽度限制改竖排说明） -->
        <rect x="196" y="196" width="194" height="34" rx="6" fill="#FAFAF9" stroke="rgba(41,37,36,0.12)"/>
        <text x="293" y="211" font-size="10" fill="#292524" text-anchor="middle" font-weight="600">每一单人工校准</text>
        <text x="293" y="224" font-size="8.5" fill="#78716C" text-anchor="middle">校完回填·飞轮</text>
        <line x1="241" y1="174" x2="241" y2="196" stroke="#A8A29E" stroke-width="1.6" marker-end="url(#arr4)"/>

        <!-- =右panel：NO.6 双车道 = -->
        <text x="424" y="20" font-size="10.5" fill="#78716C">NO.6 · 装载</text>
        <rect x="424" y="34" width="242" height="58" rx="8" fill="#FBF3E4" stroke="rgba(146,64,14,0.25)"/>
        <text x="545" y="54" font-size="11.5" fill="#92400E" text-anchor="middle" font-weight="600">大模型 · 调度</text>
        <text x="545" y="72" font-size="9.5" fill="#92400E" text-anchor="middle">听需求 · 派任务 · 讲结果</text>
        <text x="545" y="86" font-size="8.5" fill="#B45309" text-anchor="middle">会说话的管说话</text>

        <line x1="545" y1="92" x2="545" y2="112" stroke="#B45309" stroke-width="1.6" marker-end="url(#arr4r)"/>
        <line x1="531" y1="112" x2="531" y2="92" stroke="#B45309" stroke-width="1.6" marker-end="url(#arr4r)"/>
        <text x="562" y="106" font-size="9" fill="#78716C">派活 / 交结果</text>

        <rect x="424" y="112" width="242" height="72" rx="8" fill="#292524"/>
        <text x="545" y="132" font-size="11.5" fill="#FAF7F2" text-anchor="middle" font-weight="600">Python 算法 · 计算</text>
        <text x="545" y="150" font-size="9.5" fill="#D6D3D1" text-anchor="middle">高度图3D · 贪心放置</text>
        <text x="545" y="166" font-size="9.5" fill="#D6D3D1" text-anchor="middle">多策略排序 · 遗传算法</text>
        <text x="545" y="179" font-size="8.5" fill="#A8A29E" text-anchor="middle">会算数的管算数</text>

        <text x="545" y="206" font-size="9.5" fill="#78716C" text-anchor="middle">出数的口子，模型不碰</text>
        <text x="545" y="226" font-size="9" fill="#A8A29E" text-anchor="middle">空间计算 · 大模型难以胜任</text>

        <!-- 左右分隔线 -->
        <line x1="404" y1="26" x2="404" y2="236" stroke="rgba(41,37,36,0.10)" stroke-width="1"/>
      </g>
    </svg>
  </section>
</div>
