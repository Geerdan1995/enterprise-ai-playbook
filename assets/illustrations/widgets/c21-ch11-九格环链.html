<style>
:root { --text:#292524; --text-muted:#57534E; --border:rgba(41,37,36,0.14); --brand:#92400E; --brand-soft:#FBF3E4; --radius:8px; --radius-card:12px; --radius-full:999px; --s8:8px; --s16:16px; --s20:20px; --font:"Microsoft YaHei","PingFang SC",sans-serif; }
.widget { color:var(--text); font:400 14px/20px var(--font); width:100%; }
.card { box-sizing:border-box; width:100%; background:#fff; border:1px solid var(--border); border-radius:var(--radius-card); padding:var(--s16); }
</style>
<div class="widget" data-dynamic-ui-widget data-template="gantt-chart">
  <section class="card">
    <svg viewBox="0 0 680 240" style="width:684px;height:240px;display:block" role="img" aria-label="九格订单环链，回单迟到亮红牌">
      <!-- 环链：上排5格 + 下排4格（反向），组成闭环 -->
      <g font-family="Microsoft YaHei" font-size="11.5" text-anchor="middle">
        <!-- 上排 -->
        <g><rect x="46"  y="46" width="104" height="40" rx="6" fill="#FAF7F2" stroke="#A8A29E" stroke-width="1.2"/><text x="98"  y="70" fill="#292524">询价 9/22</text></g>
        <g><rect x="178" y="46" width="104" height="40" rx="6" fill="#FAF7F2" stroke="#A8A29E" stroke-width="1.2"/><text x="230" y="70" fill="#292524">报价 9/23</text></g>
        <g><rect x="310" y="46" width="104" height="40" rx="6" fill="#FAF7F2" stroke="#A8A29E" stroke-width="1.2"/><text x="362" y="70" fill="#292524">合同 9/25</text></g>
        <g><rect x="442" y="46" width="104" height="40" rx="6" fill="#FAF7F2" stroke="#A8A29E" stroke-width="1.2"/><text x="494" y="70" fill="#292524">排产 9/28</text></g>
        <g><rect x="574" y="46" width="86"  height="40" rx="6" fill="#FAF7F2" stroke="#A8A29E" stroke-width="1.2"/><text x="617" y="70" fill="#292524">装配 10/5</text></g>
        <!-- 下排（反向） -->
        <g><rect x="574" y="150" width="86"  height="40" rx="6" fill="#FAF7F2" stroke="#A8A29E" stroke-width="1.2"/><text x="617" y="174" fill="#292524">发货 10/9</text></g>
        <g><rect x="442" y="150" width="104" height="40" rx="6" fill="#FBF3E4" stroke="#92400E" stroke-width="1.8"/><text x="494" y="174" fill="#92400E" font-weight="600">签收 10/14</text><text x="494" y="163" font-size="9.5" fill="#C0392B"></text></g>
        <g><rect x="310" y="150" width="104" height="40" rx="6" fill="#FAF7F2" stroke="#A8A29E" stroke-width="1.2"/><text x="362" y="174" fill="#292524">开票 10/20</text></g>
        <g><rect x="178" y="150" width="104" height="40" rx="6" fill="#FAF7F2" stroke="#A8A29E" stroke-width="1.2"/><text x="230" y="174" fill="#292524">回款 11/2</text></g>
      </g>
      <!-- 顺向箭头（上排向右） -->
      <g stroke="#78716C" stroke-width="1.3" fill="none">
        <path d="M150 66 H 174" marker-end="url(#o1)"/>
        <path d="M282 66 H 306" marker-end="url(#o1)"/>
        <path d="M414 66 H 438" marker-end="url(#o1)"/>
        <path d="M546 66 H 570" marker-end="url(#o1)"/>
      </g>
      <!-- 右侧向下 -->
      <path d="M617 90 V 146" fill="none" stroke="#78716C" stroke-width="1.3" marker-end="url(#o1)"/>
      <!-- 下排向左箭头 -->
      <g stroke="#78716C" stroke-width="1.3" fill="none">
        <path d="M570 170 H 550" marker-end="url(#o1)"/>
        <path d="M438 170 H 418" marker-end="url(#o1)"/>
        <path d="M306 170 H 286" marker-end="url(#o1)"/>
      </g>
      <!-- 回单迟到：签收→回单 11/17 虚线长回边 -->
      <path d="M494 150 V 120" fill="none" stroke="#C0392B" stroke-width="1.5" stroke-dasharray="5 4"/>
      <text x="502" y="118" font-size="10.5" fill="#C0392B" font-family="Microsoft YaHei">回单 11/17 才到 —— 迟了 34 天</text>
      <!-- 红黄牌规则 -->
      <g font-size="11" font-family="Microsoft YaHei">
        <circle cx="212" cy="230" r="6" fill="#E8463A"/><text x="226" y="234" fill="#57534E">红牌：卡住下游</text>
        <circle cx="360" cy="230" r="6" fill="#EFAA17"/><text x="374" y="234" fill="#57534E">黄牌：快到时限</text>
        <circle cx="500" cy="230" r="6" fill="#D3D4DA"/><text x="514" y="234" fill="#57534E">灰牌：该动没动</text>
      </g>
      <defs>
        <marker id="o1" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">
          <path d="M1 1 L7 4 L1 7 Z" fill="#78716C"/>
        </marker>
      </defs>
    </svg>
  </section>
</div>
