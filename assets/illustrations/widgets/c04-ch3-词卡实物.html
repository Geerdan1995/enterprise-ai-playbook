<style>
:root { --text:#292524; --text-muted:#57534E; --border:rgba(41,37,36,0.14); --brand:#92400E; --brand-soft:#FBF3E4; --radius:8px; --radius-card:12px; --s8:8px; --s16:16px; --s20:20px; --font:"Microsoft YaHei","PingFang SC",sans-serif; }
.widget { color:var(--text); font:400 14px/20px var(--font); width:100%; }
.card { box-sizing:border-box; width:100%; background:#fff; border:1px solid var(--border); border-radius:var(--radius-card); padding:var(--s20); }
</style>
<div class="widget" data-dynamic-ui-widget data-template="explanation-panel">
  <section class="card">
    <svg viewBox="46 22 420 340" style="width:440px;height:356.2px;display:block;margin:0 auto" role="img" aria-label="一张1986年的词卡">
      <!-- 卡片本体 -->
      <g>
        <rect x="70" y="40" width="380" height="252" rx="4" fill="#FBF7EC" stroke="#78716C" stroke-width="2"/>
        <!-- 打孔与编号 -->
        <circle cx="92" cy="62" r="6" fill="#fff" stroke="#A8A29E" stroke-width="1.5"/>
        <text x="424" y="66" font-size="11" fill="#A8A29E" text-anchor="end" font-family="Consolas">目 031 · 1986</text>
        <line x1="70" y1="84" x2="450" y2="84" stroke="#A8A29E" stroke-width="1"/>
        <!-- 正词 -->
        <text x="110" y="136" font-size="34" font-weight="700" fill="#292524" font-family="KaiTi, STKaiti, serif">减速器</text>
        <text x="252" y="134" font-size="12" fill="#A8A29E" font-family="Noto Sans SC">正词</text>
        <!-- 注 -->
        <line x1="70" y1="164" x2="450" y2="164" stroke="#A8A29E" stroke-width="0.8" stroke-dasharray="3 3"/>
        <text x="110" y="190" font-size="13" fill="#57534E" font-family="Noto Sans SC">注：指整机，不指零件。</text>
        <text x="110" y="212" font-size="13" fill="#57534E" font-family="Noto Sans SC">属：传动部件。分：装于输出端。</text>
        <text x="110" y="234" font-size="13" fill="#57534E" font-family="Noto Sans SC">凭：八五年传动门底账。</text>
        <!-- 卡号脚标 -->
        <text x="110" y="272" font-size="10.5" fill="#A8A29E" font-family="Noto Sans SC">一格一个爹，一词一行注 —— 1986 · 档案室（第3章）</text>
      </g>

      <!-- 挂在卡下沿的两根线绳：代词木签 -->
      <path d="M170 292 C 170 306, 150 310, 138 316" fill="none" stroke="#78716C" stroke-width="1.4"/>
      <path d="M330 292 C 330 306, 350 310, 362 316" fill="none" stroke="#78716C" stroke-width="1.4"/>
      <g transform="rotate(-4 110 330)">
        <rect x="66" y="316" width="96" height="30" rx="3" fill="#F3EEE5" stroke="#78716C" stroke-width="1.4"/>
        <text x="114" y="336" font-size="14" fill="#292524" text-anchor="middle" font-family="KaiTi, STKaiti, serif">减速机</text>
      </g>
      <g transform="rotate(4 390 330)">
        <rect x="342" y="316" width="96" height="30" rx="3" fill="#F3EEE5" stroke="#78716C" stroke-width="1.4"/>
        <text x="390" y="336" font-size="14" fill="#292524" text-anchor="middle" font-family="KaiTi, STKaiti, serif">减速箱</text>
      </g>
      <!-- 代标签 -->
      <text x="252" y="334" font-size="12" fill="#57534E" font-family="Noto Sans SC">代 —— 别名挂到正词底下</text>
    </svg>
  </section>
</div>
