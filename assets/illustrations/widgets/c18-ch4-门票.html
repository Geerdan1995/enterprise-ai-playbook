<style>
:root { --text:#292524; --text-muted:#57534E; --border:rgba(41,37,36,0.14); --brand:#92400E; --brand-soft:#FBF3E4; --radius:8px; --radius-card:12px; --s8:8px; --s16:16px; --s20:20px; --font:"Microsoft YaHei","PingFang SC",sans-serif; }
.widget { color:var(--text); font:400 14px/20px var(--font); width:100%; }
.card { box-sizing:border-box; width:100%; background:#fff; border:1px solid var(--border); border-radius:var(--radius-card); padding:var(--s16); }
</style>
<div class="widget" data-dynamic-ui-widget data-template="explanation-panel">
  <section class="card">
    <svg viewBox="0 0 680 240" style="width:684px;height:240px;display:block" role="img" aria-label="有效目录是闸门，答案出门带出处">
      <defs>
        <marker id="m1" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">
          <path d="M1 1 L7 4 L1 7 Z" fill="#78716C"/>
        </marker>
        <marker id="m2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">
          <path d="M1 1 L7 4 L1 7 Z" fill="#92400E"/>
        </marker>
      </defs>

      <!-- 排队文件 -->
      <g fill="#DDD6CE" stroke="#A8A29E" stroke-width="0.8">
        <rect x="30" y="70" width="24" height="30" rx="2"/><rect x="60" y="70" width="24" height="30" rx="2"/><rect x="90" y="70" width="24" height="30" rx="2"/><rect x="120" y="70" width="24" height="30" rx="2"/>
      </g>
      <text x="88" y="128" font-size="11" fill="#57534E" text-anchor="middle" font-family="Microsoft YaHei">排队的文件</text>

      <!-- 闸门 -->
      <path d="M180 40 V 150" stroke="#92400E" stroke-width="3" fill="none"/>
      <path d="M216 40 V 150" stroke="#92400E" stroke-width="3" fill="none"/>
      <rect x="168" y="26" width="60" height="20" rx="4" fill="#FBF3E4" stroke="#92400E" stroke-width="1.3"/>
      <text x="198" y="40" font-size="10.5" fill="#92400E" text-anchor="middle" font-family="Microsoft YaHei">有效目录</text>

      <!-- 过闸：现行章 -->
      <g>
        <rect x="238" y="64" width="24" height="30" rx="2" fill="#FBF3E4" stroke="#92400E" stroke-width="1.2"/>
        <circle cx="250" cy="79" r="7" fill="none" stroke="#92400E" stroke-width="1.2"/>
        <path d="M246 79 L249 82 L255 75" fill="none" stroke="#92400E" stroke-width="1.4"/>
      </g>
      <path d="M268 79 H 330" fill="none" stroke="#92400E" stroke-width="1.5" marker-end="url(#m2)"/>
      <text x="298" y="70" font-size="10.5" fill="#92400E" text-anchor="middle" font-family="Microsoft YaHei">盖"现行"章的</text>

      <!-- 挡下：作废 -->
      <g>
        <rect x="238" y="112" width="24" height="30" rx="2" fill="#FDE8E4" stroke="#C0392B" stroke-width="1.2"/>
        <path d="M244 118 L256 136 M256 118 L244 136" stroke="#C0392B" stroke-width="1.3"/>
      </g>
      <path d="M268 127 H 330" fill="none" stroke="#C0392B" stroke-width="1.3" marker-end="url(#m1)"/>
      <text x="298" y="118" font-size="10.5" fill="#C0392B" text-anchor="middle" font-family="Microsoft YaHei">旧版的，挡回去</text>

      <!-- 答案出口 -->
      <rect x="336" y="52" width="130" height="66" rx="8" fill="#FBF3E4" stroke="#92400E" stroke-width="1.8"/>
      <text x="401" y="80" font-size="13" fill="#92400E" text-anchor="middle" font-family="Microsoft YaHei" font-weight="600">答案</text>
      <text x="401" y="102" font-size="11" fill="#57534E" text-anchor="middle" font-family="Microsoft YaHei">没有就说没有</text>

      <!-- 出处签 -->
      <path d="M466 85 H 506" fill="none" stroke="#92400E" stroke-width="1.5" marker-end="url(#m2)"/>
      <g>
        <rect x="510" y="62" width="130" height="46" rx="5" fill="#fff" stroke="#92400E" stroke-width="1.4"/>
        <text x="575" y="82" font-size="12" fill="#292524" text-anchor="middle" font-family="Microsoft YaHei" font-weight="500">出处签</text>
        <text x="575" y="100" font-size="10.5" fill="#57534E" text-anchor="middle" font-family="Microsoft YaHei">答的是哪份文件</text>
      </g>

      <!-- 底注 -->
      <text x="340" y="196" font-size="11.5" fill="#57534E" text-anchor="middle" font-family="Microsoft YaHei">这份目录就是问答库的门票 · 12,400 行（第4章）</text>
    </svg>
  </section>
</div>
