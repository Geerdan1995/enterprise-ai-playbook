<style>
:root { --text:#292524; --text-muted:#57534E; --border:rgba(41,37,36,0.14); --brand:#92400E; --brand-soft:#FBF3E4; --radius:8px; --radius-card:12px; --s8:8px; --s16:16px; --s20:20px; --font:"Microsoft YaHei","PingFang SC",sans-serif; }
.widget { color:var(--text); font:400 14px/20px var(--font); width:100%; }
.card { box-sizing:border-box; width:100%; background:#fff; border:1px solid var(--border); border-radius:var(--radius-card); padding:var(--s16); }
</style>
<div class="widget" data-dynamic-ui-widget data-template="node-flow">
  <section class="card">
    <svg viewBox="0 0 680 250" style="width:684px;height:250px;display:block" role="img" aria-label="知识三层台阶，顶层最窄">
      <!-- 台阶：从左到右升高变窄 -->
      <!-- 第一层：最宽 -->
      <g font-family="Microsoft YaHei">
        <rect x="40" y="150" width="240" height="56" rx="6" fill="#FAF7F2" stroke="#A8A29E" stroke-width="1.3"/>
        <text x="160" y="174" font-size="13" fill="#292524" text-anchor="middle" font-weight="500">手册里有，记不住</text>
        <text x="160" y="195" font-size="11" fill="#57534E" text-anchor="middle">31 题 · 油品牌号、加脂周期、力矩值</text>
        <!-- 第二层 -->
        <rect x="300" y="100" width="190" height="106" rx="6" fill="#F3EEE5" stroke="#A8A29E" stroke-width="1.3"/>
        <text x="395" y="140" font-size="13" fill="#292524" text-anchor="middle" font-weight="500">照手册做会错</text>
        <text x="395" y="161" font-size="11" fill="#57534E" text-anchor="middle">9 题 · 矿上这台改过</text>
        <!-- 第三层：最窄最高（焦点） -->
        <rect x="510" y="46" width="130" height="160" rx="6" fill="#FBF3E4" stroke="#92400E" stroke-width="1.8"/>
        <text x="575" y="86" font-size="13" fill="#92400E" text-anchor="middle" font-weight="600">手册上没有</text>
        <text x="575" y="107" font-size="11" fill="#92400E" text-anchor="middle">18 题</text>
        <text x="575" y="130" font-size="10.5" fill="#57534E" text-anchor="middle">段兴的十一本本子</text>
        <text x="575" y="148" font-size="10.5" fill="#57534E" text-anchor="middle">老唐的耳朵</text>
      </g>
      <!-- 上行小箭头 -->
      <path d="M284 170 H 296" fill="none" stroke="#78716C" stroke-width="1.3" marker-end="url(#n1)"/>
      <path d="M494 130 H 506" fill="none" stroke="#78716C" stroke-width="1.3" marker-end="url(#n1)"/>
      <defs>
        <marker id="n1" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">
          <path d="M1 1 L7 4 L1 7 Z" fill="#78716C"/>
        </marker>
      </defs>

      <!-- 顶注 -->
      <text x="575" y="30" font-size="11.5" fill="#92400E" text-anchor="middle" font-family="Microsoft YaHei">最值钱的在最窄那层</text>
      <!-- 底注 -->
      <text x="340" y="236" font-size="11.5" fill="#57534E" text-anchor="middle" font-family="Microsoft YaHei">站上白板 58 问归并三层（第9章）</text>
    </svg>
  </section>
</div>
